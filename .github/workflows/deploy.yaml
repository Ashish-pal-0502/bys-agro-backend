name: Build and Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-south-1
    
    - name: Login to Amazon ECR
      run: |
        aws ecr get-login-password --region ap-south-1 | \
        docker login --username AWS --password-stdin 380881225010.dkr.ecr.ap-south-1.amazonaws.com

    - name: Build and tag Docker image
      run: |
        docker build -t motherland-honey .
        docker tag motherland-honey:latest 380881225010.dkr.ecr.ap-south-1.amazonaws.com/motherland-honey:latest

    - name: Push image to ECR
      run: |
        docker push 380881225010.dkr.ecr.ap-south-1.amazonaws.com/motherland-honey:latest

    - name: Remove untagged images from ECR
      run: |
        IMAGE_REPO="motherland-honey"
        REGION="ap-south-1"

        # List image digests without tags (untagged images)
        IMAGE_DIGESTS=$(aws ecr list-images \
          --repository-name $IMAGE_REPO \
          --filter tagStatus=UNTAGGED \
          --region $REGION \
          --query 'imageIds[*].imageDigest' \
          --output text)

        # Delete each untagged image digest
        for digest in $IMAGE_DIGESTS; do
          echo "Deleting untagged image: $digest"
          aws ecr batch-delete-image \
            --repository-name $IMAGE_REPO \
            --image-ids imageDigest=$digest \
            --region $REGION
        done

    - name: Deploy on EC2 via SSH
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ec2-user
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          sudo docker stop motherland-backend || true
          sudo docker rm motherland-backend || true
          sudo docker rmi 380881225010.dkr.ecr.ap-south-1.amazonaws.com/motherland-honey:latest || true

          sudo aws ecr get-login-password --region ap-south-1 | \
          sudo docker login --username AWS --password-stdin 380881225010.dkr.ecr.ap-south-1.amazonaws.com

          sudo docker pull 380881225010.dkr.ecr.ap-south-1.amazonaws.com/motherland-honey:latest

          sudo docker run -d \
            --restart unless-stopped \
            -p 5000:5000 \
            --name motherland-backend \
            380881225010.dkr.ecr.ap-south-1.amazonaws.com/motherland-honey:latest
